<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript Example</title>
    <style>
        body {
            font-family: sans-serif;
        }

        header,
        footer {
            background-color: #f0f0f0;
            padding: 1em;
            text-align: center;
        }

        main {
            padding: 1em;
        }

        .user-profile,
        .product-list {
            margin-bottom: 1em;
            border: 1px solid #ccc;
            padding: 1em;
        }

        .error {
            color: red;
        }

        button {
            padding: 0.5em 1em;
            border: 1px solid #ccc;
            background-color: #e0e0e0;
            cursor: pointer;
        }

        button:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="main.js"></script>
</body>

</html>
